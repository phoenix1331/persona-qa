<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PersonaQA report</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #5d6573; --line: #dde1e7;
    --accent: #ff6b00; --critical: #b3261e; --high: #d9480f; --medium: #b08800; --low: #4a6fa5;
    --ok: #1f7a4d; --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --panel: #1a1d23; --ink: #eceef2; --muted: #9aa3b2; --line: #2c313a;
      --critical: #ff6b61; --high: #ff8f4d; --medium: #e5c33d; --low: #8fb0e0; --ok: #4cc38a; --chip: #252a33;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; }
  header img { height: 48px; width: auto; display: block; }
  header .meta { color: var(--muted); }
  header h1 { margin: 0; font-size: 1.25rem; color: var(--ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .value { font-size: 1.6rem; font-weight: 700; }
  .tile .value.text { font-size: 1.1rem; line-height: 2.2rem; }
  .tile .label { color: var(--muted); font-size: 0.85rem; }
  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font: inherit; color: var(--muted); cursor: pointer; }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 14px; color: var(--muted); }
  .filters label { display: inline-flex; gap: 6px; align-items: center; }
  select { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .badge { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px; color: #fff; }
  .badge.critical { background: var(--critical); } .badge.high { background: var(--high); }
  .badge.medium { background: var(--medium); color: #1a1a1a; } .badge.low { background: var(--low); }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 0.85rem; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); }
  .evidence { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 10px 0; }
  .shots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .shots img { width: 160px; height: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
  .outcome-success { color: var(--ok); font-weight: 600; }
  .outcome-abandoned, .outcome-limit, .outcome-incomplete { color: var(--high); font-weight: 600; }
  .journal { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 12px; margin-top: 8px; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 4px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  footer { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 24px; }
  @media (max-width: 640px) { header img { height: 36px; } th:nth-child(n+5), td:nth-child(n+5) { display: none; } }
</style>
</head>
<body>
<header>
  <picture>
    <source srcset="{{LOGO_ON_DARK}}" media="(prefers-color-scheme: dark)">
    <img src="{{LOGO_ON_LIGHT}}" alt="PersonaQA">
  </picture>
  <div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </div>
</header>
<main>
  <section class="tiles" id="tiles" aria-label="Run totals"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section id="panel" role="tabpanel"></section>
</main>
<footer>Generated by PersonaQA. Personas are simulated users: confirm findings before acting on them. Automated accessibility checks catch only part of WCAG.</footer>
<script type="application/json" id="data">{{DATA_JSON}}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('data').textContent);
  const SEVERITIES = ['critical', 'high', 'medium', 'low'];
  const el = (tag, props = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else node.setAttribute(key, value);
    }
    for (const child of children.flat()) if (child) node.append(child);
    return node;
  };
  const badge = (severity) => el('span', { class: `badge ${severity}`, text: severity });
  const shot = (session, path) => path ? el('a', { href: `${session}/${path}`, target: '_blank' }, el('img', { src: `${session}/${path}`, alt: `Screenshot from ${session}`, loading: 'lazy' })) : null;

  document.getElementById('title').textContent = `${data.app} - persona run`;
  document.getElementById('meta').textContent = `Run ${data.run_id} · ${data.generated_at.slice(0, 16).replace('T', ' ')} · ${data.base_url}`;

  const counts = (key) => data.sessions.filter((session) => session.outcome === key).length;
  const tiles = [
    [data.sessions.length, 'sessions'],
    [counts('success'), 'reached the goal'],
    [data.sessions.length - counts('success'), 'did not'],
    [data.findings.length, 'findings'],
    [data.findings.filter((finding) => ['critical', 'high'].includes(finding.severity)).length, 'high or critical'],
    [data.cost.label, 'runner tokens'],
  ];
  document.getElementById('tiles').append(...tiles.map(([value, label]) => el('div', { class: 'tile' }, el('div', { class: typeof value === 'number' ? 'value' : 'value text', text: String(value) }), el('div', { class: 'label', text: label }))));

  const state = { severities: new Set(SEVERITIES), persona: 'all' };

  function findingsView() {
    const wrap = el('div');
    const filters = el('div', { class: 'filters' }, el('span', { text: 'Show:' }));
    for (const severity of SEVERITIES) {
      const box = el('input', { type: 'checkbox' });
      box.checked = state.severities.has(severity);
      box.addEventListener('change', () => { box.checked ? state.severities.add(severity) : state.severities.delete(severity); render(); });
      filters.append(el('label', {}, box, badge(severity)));
    }
    const select = el('select', { 'aria-label': 'Persona' }, el('option', { value: 'all', text: 'All personas' }), ...data.personas.map((persona) => el('option', { value: persona.id, text: persona.name })));
    select.value = state.persona;
    select.addEventListener('change', () => { state.persona = select.value; render(); });
    filters.append(select);
    wrap.append(filters);

    const shown = data.findings.filter((finding) => state.severities.has(finding.severity) && (state.persona === 'all' || finding.personas.includes(state.persona)));
    if (shown.length === 0) wrap.append(el('div', { class: 'empty', text: 'No findings match these filters.' }));

    for (const finding of shown) {
      const card = el('article', { class: 'card' },
        el('div', { class: 'row' }, el('span', { class: 'rank', text: `#${finding.rank}` }), badge(finding.severity), el('span', { class: 'chip', text: finding.category }), el('span', { class: 'muted', text: finding.id }), finding.status !== 'new' ? el('span', { class: 'chip', text: finding.github_issue ? 'filed' : finding.status }) : null),
        el('h3', { text: finding.title }),
        el('p', { text: finding.summary }),
        el('div', { class: 'row' }, el('span', { class: 'muted', text: `Hit by ${finding.personas.length} of ${data.personas.length}:` }), ...finding.personas.map((id) => el('span', { class: 'chip', text: data.personas.find((persona) => persona.id === id)?.name ?? id }))),
      );
      if (finding.suggested_fix) card.append(el('p', {}, el('strong', { text: 'Suggested fix: ' }), finding.suggested_fix));
      const details = el('details', {}, el('summary', { text: `Evidence (${finding.evidence.length})` }));
      for (const item of finding.evidence) {
        details.append(el('div', { class: 'evidence' },
          el('div', { class: 'muted', text: `${item.session} · step ${item.step} · ${item.url}` }),
          el('p', {}, el('strong', { text: 'What happened: ' }), item.what_happened),
          el('p', {}, el('strong', { text: 'Expected: ' }), item.expected),
          el('div', { class: 'shots' }, shot(item.session, item.screenshot)),
        ));
      }
      card.append(details);
      wrap.append(card);
    }
    return wrap;
  }

  function sessionsView() {
    const wrap = el('div');
    const table = el('table', {},
      el('thead', {}, el('tr', {}, ...['Persona', 'Mission', 'Outcome', 'Steps', 'Longest wait', 'Device'].map((heading) => el('th', { text: heading })))),
      el('tbody', {}, ...data.sessions.map((session) => el('tr', {},
        el('td', { text: session.persona_name }), el('td', { text: session.mission }),
        el('td', { class: `outcome-${session.outcome}`, text: session.outcome }), el('td', { text: String(session.steps) }),
        el('td', { text: `${session.longest_wait_seconds}s` }), el('td', { text: session.environment }),
      ))),
    );
    wrap.append(table);
    for (const session of data.sessions) {
      wrap.append(el('article', { class: 'card' },
        el('h3', { text: `${session.persona_name} · ${session.mission}` }),
        el('div', { class: 'muted', text: `${session.outcome} (${session.end_reason}) · ${session.steps} steps · ${session.duration_seconds}s · ${session.environment}` }),
        el('div', { class: 'journal', text: session.journal || 'No journal was written.' }),
        el('div', { class: 'shots' }, ...session.screenshots.slice(-6).map((path) => shot(session.dir, path))),
        session.trace ? el('p', { class: 'muted' }, 'Trace: ', el('code', { text: `npx playwright show-trace ${session.dir}/trace.zip` })) : null,
      ));
    }
    return wrap;
  }

  function listView(items, emptyText) {
    if (!items || items.length === 0) return el('div', { class: 'empty', text: emptyText });
    return el('div', {}, ...items.map((item) => el('article', { class: 'card' },
      el('div', { class: 'row' }, badge(item.severity), ...(item.tags ?? []).map((tag) => el('span', { class: 'chip', text: tag }))),
      el('h3', { text: item.title }),
      el('p', { text: item.detail }),
      item.personas?.length ? el('div', { class: 'muted', text: `Personas affected: ${item.personas.join(', ')}` }) : null,
      item.fix ? el('p', {}, el('strong', { text: 'Suggested fix: ' }), item.fix) : null,
    )));
  }

  const tabs = [['findings', 'Findings', findingsView], ['sessions', 'Sessions', sessionsView]];
  if (data.a11y) tabs.push(['a11y', 'Accessibility', () => listView(data.a11y, 'No accessibility findings.')]);
  if (data.ux) tabs.push(['ux', 'UX', () => listView(data.ux, 'No UX findings.')]);
  let current = 'findings';
  const tabBar = document.getElementById('tabs');

  function render() {
    tabBar.replaceChildren(...tabs.map(([id, label]) => {
      const button = el('button', { role: 'tab', 'aria-selected': String(id === current), text: label });
      button.addEventListener('click', () => { current = id; render(); });
      return button;
    }));
    document.getElementById('panel').replaceChildren(tabs.find(([id]) => id === current)[2]());
  }
  render();
})();
</script>
</body>
</html>
